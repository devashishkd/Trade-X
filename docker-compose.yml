services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: node backend/auth-service/dist/server.js
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=${AUTH_DB_URI:-mongodb+srv://trade-x:Devashish%4010@cluster0.9fcja5p.mongodb.net/auth-db}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_123}
      - JWT_EXPIRES_IN=7d
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: node backend/order-service/dist/server.js
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGO_URI=${ORDER_DB_URI:-mongodb+srv://trade-x:Devashish%4010@cluster0.9fcja5p.mongodb.net/order-db}
      - MATCHING_ENGINE_URL=http://matching-engine:3003
      - PORTFOLIO_SERVICE_URL=http://portfolio-service:3004
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_123}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  matching-engine:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: node backend/matching-engine/dist/server.js
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MARKET_DATA_SERVICE_URL=http://market-data-service:3005
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  portfolio-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: node backend/portfolio-service/dist/server.js
    environment:
      - NODE_ENV=production
      - PORT=3004
      - MONGO_URI=${PORTFOLIO_DB_URI:-mongodb+srv://trade-x:Devashish%4010@cluster0.9fcja5p.mongodb.net/portfolio-db}
      - MARKET_DATA_SERVICE_URL=http://market-data-service:3005
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_123}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  market-data-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: node backend/market-data-service/dist/server.js
    environment:
      - NODE_ENV=production
      - PORT=3005
      - MONGO_URI=${MARKET_DB_URI:-mongodb+srv://trade-x:Devashish%4010@cluster0.9fcja5p.mongodb.net/market-db}
      - MATCHING_ENGINE_URL=http://matching-engine:3003
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: node backend/api-gateway/dist/server.js
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - ORDER_SERVICE_URL=http://order-service:3002
      - MATCHING_ENGINE_URL=http://matching-engine:3003
      - PORTFOLIO_SERVICE_URL=http://portfolio-service:3004
      - MARKET_DATA_SERVICE_URL=http://market-data-service:3005
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_123}
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      auth-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      matching-engine:
        condition: service_healthy
      portfolio-service:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: /
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
    restart: always
