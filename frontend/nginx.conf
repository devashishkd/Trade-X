server {
    listen 80;
    server_name localhost;

    # Docker DNS resolver — harmless on Render since we use env-var upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Serve static frontend files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the API Gateway.
    # NGINX_API_UPSTREAM is injected at container start by the entrypoint.
    location /api/ {
        set $api_upstream ${NGINX_API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy WebSocket connections to Market Data Service.
    # NGINX_SOCKET_UPSTREAM is injected at container start by the entrypoint.
    location /socket.io/ {
        set $socket_upstream ${NGINX_SOCKET_UPSTREAM};
        proxy_pass $socket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
